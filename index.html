<div class="kitty-clock">
    <span>🎀</span>
    <div id="clock">00:00:00</div>
    <p>♡ time to be pawsome ♡</p>
</div>

    <script>
        const cat = document.querySelector(".mouse-cat");

    document.addEventListener("mousemove", (event) => {
        cat.style.left = event.clientX + 12 + "px";
        cat.style.top = event.clientY + 12 + "px";
    });

    function updateClock() {
        const now = new Date();

        document.getElementById("clock").textContent =
            now.toLocaleTimeString("en-GB");
    }

    updateClock();
    setInterval(updateClock, 1000);
        
    </script>
